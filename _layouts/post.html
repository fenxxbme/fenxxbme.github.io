<html lang="{{ page.lang | default: 'en' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ page.title | escape }} · fenxxbme</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3ec;color:#242321;font:17px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:720px;margin:auto;padding:40px 24px 80px}a{color:#a62935;text-underline-offset:4px}header{border-bottom:1px solid #d8d1c7;padding-bottom:26px;margin-bottom:40px}header a{font:16px ui-monospace,monospace;text-decoration:none}h1{font:clamp(34px,7vw,48px)/1.2 Georgia,serif;margin:28px 0 16px;overflow-wrap:anywhere}h2,h3{line-height:1.35}time,.meta{font:12px ui-monospace,monospace;color:#66615d}img{max-width:100%;height:auto}pre{overflow:auto;padding:20px;background:#ebe6dc;border-radius:4px}code{font-size:.88em}blockquote{border-left:2px solid #a62935;margin:24px 0;padding-left:20px;color:#66615d}table{display:block;max-width:100%;overflow:auto;border-collapse:collapse}td,th{padding:8px;border:1px solid #d8d1c7}footer{border-top:1px solid #d8d1c7;margin-top:50px;padding-top:22px}a:focus-visible{outline:2px solid #a62935;outline-offset:4px}</style></head><body><main><header><a href="{{ '/' | relative_url }}">← fenxxbme / notebook</a></header><article><div class="meta">{{ page.category | default: "Notes" | escape }} · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time></div><h1>{{ page.title | escape }}</h1>{{ content }}</article><footer><a href="{{ '/#writing' | relative_url }}">← All notes & loose threads</a></footer></main></body></html>
